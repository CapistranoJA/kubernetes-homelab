- name: Create /etc/kubernetes directory
  ansible.builtin.file:
    path: {{kube_config_path}}
    state: present
    mode: '0755'

- name: Kubeadm configuration
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: "{{kube_config_path}}/kubeadm-config.yaml"
    owner: root
    group: root
    mode: '0600'

