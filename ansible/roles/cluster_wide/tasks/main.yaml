- name: Update System
  ansible.builtin.apt:
    update_cache: yes

- name: Upgrade the system
  ansible.builtin.apt:
    upgrade: yes

- name: Add Host entries in etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} k8s Hosts"
    block: "{{ lookup('template','hosts.j2') }}"
    insertafter: EOF

- name: Add IP Forwarding
  ansible.posix.sysctl:
    sysctl_file: /etc/sysctl.d/k8s.conf
    name: net.ipv4.ip_forward
    value: 1
    sysctl_set: true
    reload: true

- name: Load Overlay module
  community.general.modprobe:
    name: overlay
    state: present
    persistent: present

- name: Download LTS of containerd
  ansible.builtin.apt:
    name: containerd.io=