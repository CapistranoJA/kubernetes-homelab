- name: Update System
  ansible.builtin.apt:
    update_cache: yes

- name: Upgrade the system
  ansible.builtin.apt:
    upgrade: yes

- name: Add Host entries in etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} k8s Hosts"
    block: "{{ lookup('template','hosts.j2') }}"
    insertafter: EOF

- name: Add IP Forwarding
  ansible.posix.sysctl:
    sysctl_file: /etc/sysctl.d/k8s.conf
    name: net.ipv4.ip_forward
    value: 1
    sysctl_set: yes
    reload: yes

- name: Load Overlay module
  community.general.modprobe:
    name: overlay
    state: present
    persistent: present

- name: Download containerd pinned version
  ansible.builtin.get_url:
    url: "{{containerd.url}}"
    dest: "/tmp/{{containerd.name}}"
    checksum: "{{containerd_checksum}}"

- name: Extraction of containerd
  ansible.builtin.unarchive:
    src: "/tmp/{{containerd.name}}"
    dest: /usr/local
    remote_src: yes

- name: Create containerd directory
  ansible.builtin.file:
    path: "{{containerd.installation_dir}}"
    state: directory
    mode: '0755'

- name: Download Systemd service unit
  ansible.builtin.get_url:
    url: "{{containerd.main_systemd_unit}}"
    dest: "{{containerd.installation_dir}}"

- name: Reload daemon
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Create containerd config directory
  ansible.builtin.file:
    path: "{{containerd.config_dir}}"
    state: directory
    mode: '0755'

- name: Get default containerd config
  ansible.builtin.command:
    cmd: "containerd config default > {{containerd.config_dir}}/{{containerd.config_name}}"
    creates: "{{containerd.config_dir}}/{{containerd.config_name}}"